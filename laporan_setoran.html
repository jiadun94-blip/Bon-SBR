<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBRdigital | Form Laporan Setoran</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --accent: #27ae60; --text: #333333; --input-bg: #ffffff; --border: #cbd5e0; }
        body { font-family: 'Roboto Condensed', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 100px; }

        .header { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .logo-box img { height: 45px; width: auto; display: block; }
        .header-text { text-align: right; }
        .header-text h2 { font-size: 18px; color: var(--accent); margin: 0; text-transform: uppercase; font-weight: 700; }
        .header-text h2 span { color: #2980b9; }
        .header-text p { font-size: 11px; color: #666; margin: 3px 0 0 0; }

        .draft-banner { display: none; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #fffbeb; border: 1.5px solid #f59e0b; color: #92400e; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; font-weight: 700; }
        .draft-banner.show { display: flex; }
        .draft-actions { display: flex; gap: 8px; }
        .btn-draft-ok { background: #d97706; color: #fff; border: none; border-radius: 8px; padding: 7px 12px; font: 700 12px 'Roboto Condensed', sans-serif; cursor: pointer; }
        .btn-draft-del { background: #fff; color: #92400e; border: 1px solid #f59e0b; border-radius: 8px; padding: 7px 10px; font: 700 12px 'Roboto Condensed', sans-serif; cursor: pointer; }

        .section-title {
            font-size: 12px;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            margin: 20px 5px 10px 5px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-form { background: var(--card); padding: 18px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        label { display: block; font-size: 15px; margin-bottom: 8px; color: var(--text); font-weight: bold; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; box-sizing: border-box; }

        .km-hint { margin: -10px 0 14px 2px; font-size: 12.5px; color: #475569; font-weight: 700; display: none; }
        .km-hint.show { display: block; }
        .km-warn { margin: -8px 0 14px 0; padding: 10px 12px; border-radius: 8px; background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; font-size: 12.5px; font-weight: 700; display: none; }
        .km-warn.show { display: block; }

        .nota-container { background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 5px; margin-bottom: 15px; max-height: 350px; overflow-y: auto; }
        .nota-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); gap: 15px; }
        .nota-item:last-child { border-bottom: none; }
        .nota-item input[type="checkbox"] { width: 28px; height: 28px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; margin: 0; }
        .nota-info { flex: 1; }
        .txt-tgl { font-size: 13px; color: #7f8c8d; display: block; margin-bottom: 4px; border-bottom: 1px dashed var(--border); padding-bottom: 2px; }
        .baris-bawah { display: flex; justify-content: space-between; gap: 10px; }
        .txt-agen { font-size: 15px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        .txt-nota { font-size: 15px; color: #2c3e50; font-weight: 700; }

        .readonly-auto { color: #d97706 !important; font-weight: bold; background: #fffdf5 !important; }
        .btn-setor { width: 100%; padding: 16px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent) 0%, #2ecc71 100%); color: white; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .btn-setor:disabled { opacity: 0.65; cursor: not-allowed; }
        .select-sumber { border: 1px solid #d97706 !important; color: #d97706 !important; font-weight: bold; background: #fffdf5 !important; }

        /* Riwayat Setoran Terakhir */
        .hist-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.04); }
        .hist-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .hist-date { font-size: 12px; color: #64748b; font-weight: 700; }
        .badge-status { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-wait { background: #fef3c7; color: #92400e; }
        .hist-main { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .hist-sub { font-size: 12.5px; color: #475569; line-height: 1.5; margin-bottom: 10px; }
        .btn-resend-wa { width: 100%; padding: 10px 12px; border: 1px solid #16a34a; border-radius: 8px; background: #f0fdf4; color: #15803d; font: 700 13px 'Roboto Condensed', sans-serif; cursor: pointer; text-transform: uppercase; }
        .btn-resend-wa:active { background: #dcfce7; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-box">
        <img id="logoBrand" src="logo.png" alt="SBRdigital Lembang Bandung Barat" onerror="this.src='logo.png'">
    </div>
    <div class="header-text">
        <h2 id="welcomeNama">HALO, DRIVER!</h2>
        <p>LAPORAN SETORAN</p>
    </div>
</div>

<!-- Banner Pemulihan Draf Offline -->
<div id="draftBanner" class="draft-banner" role="status">
    <span id="draftBannerText">💾 Draf laporan belum terkirim ditemukan.</span>
    <div class="draft-actions">
        <button type="button" class="btn-draft-ok" onclick="pulihkanDrafSetoran()">Pulihkan</button>
        <button type="button" class="btn-draft-del" onclick="hapusDrafSetoran(true)">Buang</button>
    </div>
</div>

<div class="section-title">
    <span>📦 PILIH ARMADA &amp; NOTA</span>
    <span><a href="dashboard_driver.html">Kembali ke dashboard</a></span>
</div>
<div class="card-form">
    <label>UNIT ARMADA</label>
    <select id="selMobil" onchange="cariNotaAktif(); simpanDrafSetoran();"><option value="">-- Pilih Armada --</option></select>

    <label>DAFTAR NOTA TERKINI</label>
    <div id="notaList" class="nota-container">
        <div style="color:#7f8c8d; font-size:13px; text-align:center; padding:30px;">Pilih armada...</div>
    </div>

    <label>TOTAL SELURUH CASH (Rp)</label>
    <input type="text" id="uang_cash_disp" class="readonly-auto" placeholder="0" readonly>

    <label>ODOMETER TERAKHIR (KM)</label>
    <input type="text" id="km_input" placeholder="Isi angka KM..." oninput="formatRibuan(this); cekValidasiOdometer(); simpanDrafSetoran();" inputmode="numeric">
    <div id="kmLastInfo" class="km-hint"></div>
    <div id="kmWarningBox" class="km-warn"></div>
</div>

<div class="section-title">💸 RINCIAN PENGELUARAN JALAN</div>
<div class="card-form">
    <label style="color: #d97706;">PENGELUARAN DIAMBIL DARI DANA AGEN MANA?</label>
    <select id="sumber_agen" class="select-sumber" onchange="simpanDrafSetoran()">
        <option value="">-- Pilih Nota Dahulu Di Atas --</option>
    </select>

    <label>UANG JALAN (Rp)</label>
    <input type="text" id="exp_jalan" placeholder="0" oninput="formatRibuan(this); simpanDrafSetoran();" inputmode="numeric">

    <label>BENSIN/SOLAR (Rp)</label>
    <input type="text" id="exp_bbm" placeholder="0" oninput="formatRibuan(this); simpanDrafSetoran();" inputmode="numeric">

    <label>UANG BONGKAR (Rp)</label>
    <input type="text" id="exp_bongkar" placeholder="0" oninput="formatRibuan(this); simpanDrafSetoran();" inputmode="numeric">

    <label style="color: #d97706;">PENGELUARAN LAINNYA (KETERANGAN &amp; NOMINAL)</label>
    <input type="text" id="exp_lain_ket" placeholder="Ket: misal Parkir / Tol / Tambal Ban" oninput="simpanDrafSetoran()">
    <input type="text" id="exp_lain_nom" placeholder="0" oninput="formatRibuan(this); simpanDrafSetoran();" inputmode="numeric">

    <button class="btn-setor" onclick="setorDataHariIni()">🚀 SIMPAN &amp; KIRIM WA</button>
</div>

<div class="section-title">
    <span>🕒 RIWAYAT SETORAN TERAKHIR</span>
    <span id="riwayatScopeLabel" style="font-size:11px; color:#64748b; text-transform:none;"></span>
</div>
<div id="riwayatSetoranList">
    <div class="hist-card" style="text-align:center; color:#64748b; font-size:13px;">Memuat riwayat setoran...</div>
</div>

<script>
    const SUPABASE_URL = "https://wunnynznajgwltzqdvfi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HJGWlUbTi-sT6tpFU4eZ1g_um4hmtVd";
    const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DRAFT_KEY = "sbr_draft_laporan_setoran_v1";
    const userLogin = localStorage.getItem("userNama") || "Driver";
    let dataNotaTerakhir = [];
    let armadaKmMap = {};
    let riwayatSetoranCache = [];
    let sedangMenyimpan = false;
    let sedangMemulihkanDraf = false;

    function escHtml(str) {
        return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function formatRibuan(elemen) {
        let val = elemen.value.replace(/[^0-9]/g, "");
        if (val === "") { elemen.value = ""; return; }
        elemen.value = parseInt(val, 10).toLocaleString('id-ID');
    }

    function getAngka(str) {
        if(!str) return 0;
        let murni = String(str).replace(/[^0-9]/g, "");
        return parseInt(murni, 10) || 0;
    }

    /* ============ MODE OFFLINE DRAFT (localStorage) ============ */
    function simpanDrafSetoran() {
        if (sedangMemulihkanDraf) return;
        try {
            const plat = document.getElementById('selMobil').value;
            const checkedNotas = Array.from(document.querySelectorAll('input[name="nota_pilih"]:checked')).map(cb => cb.value);
            const km = document.getElementById('km_input').value;
            const sumber = document.getElementById('sumber_agen').value;
            const uJalan = document.getElementById('exp_jalan').value;
            const uBBM = document.getElementById('exp_bbm').value;
            const uBongkar = document.getElementById('exp_bongkar').value;
            const ketLain = document.getElementById('exp_lain_ket').value;
            const nomLain = document.getElementById('exp_lain_nom').value;

            const adaIsi = plat || km || uJalan || uBBM || uBongkar || ketLain || nomLain || checkedNotas.length > 0;
            if (!adaIsi) {
                localStorage.removeItem(DRAFT_KEY);
                return;
            }
            localStorage.setItem(DRAFT_KEY, JSON.stringify({
                savedAt: Date.now(),
                plat, checkedNotas, km, sumber, uJalan, uBBM, uBongkar, ketLain, nomLain
            }));
        } catch (e) {}
    }

    function cekDrafTersimpan() {
        try {
            const raw = localStorage.getItem(DRAFT_KEY);
            if (!raw) return;
            const draf = JSON.parse(raw);
            if (!draf || !draf.savedAt || (Date.now() - draf.savedAt) > 24 * 60 * 60 * 1000) {
                localStorage.removeItem(DRAFT_KEY);
                return;
            }
            const jam = new Date(draf.savedAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const infoUnit = draf.plat ? ` (${draf.plat})` : '';
            document.getElementById('draftBannerText').textContent = `💾 Draf setoran tersimpan pkl ${jam}${infoUnit}.`;
            document.getElementById('draftBanner').classList.add('show');
        } catch (e) {
            localStorage.removeItem(DRAFT_KEY);
        }
    }

    async function pulihkanDrafSetoran() {
        try {
            const raw = localStorage.getItem(DRAFT_KEY);
            if (!raw) return;
            const draf = JSON.parse(raw);
            sedangMemulihkanDraf = true;
            document.getElementById('draftBanner').classList.remove('show');

            if (draf.plat) {
                document.getElementById('selMobil').value = draf.plat;
                await cariNotaAktif();
                if (Array.isArray(draf.checkedNotas) && draf.checkedNotas.length > 0) {
                    document.querySelectorAll('input[name="nota_pilih"]').forEach(cb => {
                        if (draf.checkedNotas.includes(cb.value)) cb.checked = true;
                    });
                    hitungOtomatis();
                }
            }
            if (draf.sumber) document.getElementById('sumber_agen').value = draf.sumber;
            if (draf.km) document.getElementById('km_input').value = draf.km;
            if (draf.uJalan) document.getElementById('exp_jalan').value = draf.uJalan;
            if (draf.uBBM) document.getElementById('exp_bbm').value = draf.uBBM;
            if (draf.uBongkar) document.getElementById('exp_bongkar').value = draf.uBongkar;
            if (draf.ketLain) document.getElementById('exp_lain_ket').value = draf.ketLain;
            if (draf.nomLain) document.getElementById('exp_lain_nom').value = draf.nomLain;

            cekValidasiOdometer();
        } catch (e) {
            alert("Gagal memulihkan draf: " + e.message);
        } finally {
            sedangMemulihkanDraf = false;
        }
    }

    function hapusDrafSetoran(tutupBanner) {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        if (tutupBanner) document.getElementById('draftBanner').classList.remove('show');
    }

    /* ============ VALIDASI ODOMETER ANTI-SALAH KETIK ============ */
    function updateInfoKmArmada() {
        const plat = document.getElementById('selMobil').value;
        const infoEl = document.getElementById('kmLastInfo');
        if (!plat || armadaKmMap[plat] === undefined) {
            infoEl.classList.remove('show');
            infoEl.textContent = '';
            cekValidasiOdometer();
            return;
        }
        const lastKm = armadaKmMap[plat];
        infoEl.textContent = `📍 KM terakhir tercatat: ${lastKm.toLocaleString('id-ID')} KM`;
        infoEl.classList.add('show');
        cekValidasiOdometer();
    }

    function cekValidasiOdometer() {
        const plat = document.getElementById('selMobil').value;
        const kmRaw = getAngka(document.getElementById('km_input').value);
        const warnEl = document.getElementById('kmWarningBox');
        const lastKm = (plat && armadaKmMap[plat] !== undefined) ? armadaKmMap[plat] : 0;

        if (!plat || kmRaw === 0 || lastKm <= 0) {
            warnEl.classList.remove('show');
            warnEl.textContent = '';
            return { ok: true, msg: '' };
        }
        if (kmRaw < lastKm) {
            const msg = `⚠️ Odometer (${kmRaw.toLocaleString('id-ID')} KM) lebih kecil dari KM terakhir unit (${lastKm.toLocaleString('id-ID')} KM). Cek kembali jumlah digitnya!`;
            warnEl.textContent = msg;
            warnEl.classList.add('show');
            return { ok: false, msg };
        }
        const selisih = kmRaw - lastKm;
        if (selisih > 1000) {
            const msg = `⚠️ Selisih perjalanan +${selisih.toLocaleString('id-ID')} KM dari KM terakhir (${lastKm.toLocaleString('id-ID')} KM). Pastikan tidak kelebihan angka nol!`;
            warnEl.textContent = msg;
            warnEl.classList.add('show');
            return { ok: false, msg };
        }
        warnEl.classList.remove('show');
        warnEl.textContent = '';
        return { ok: true, msg: '' };
    }

    async function loadArmada() {
        try {
            const { data, error } = await _sb
                .from('monitoring_kendaraan')
                .select('plat_nomor, nama_unit, km_saat_ini')
                .order('nama_unit');
            if(error) return alert("Gagal load armada: " + error.message);
            const sel = document.getElementById('selMobil');
            sel.innerHTML = '<option value="">-- Pilih Armada --</option>';
            armadaKmMap = {};
            (data || []).forEach(v => {
                armadaKmMap[v.plat_nomor] = Number(v.km_saat_ini || 0);
                let opt = document.createElement('option');
                opt.value = v.plat_nomor;
                opt.text = v.nama_unit;
                sel.appendChild(opt);
            });
            cekDrafTersimpan();
        } catch(err) { alert("Error load armada: " + err.message); }
    }

    async function cariNotaAktif() {
        updateInfoKmArmada();
        const plat = document.getElementById('selMobil').value;
        if(!plat) return;
        try {
            const { data, error } = await _sb.from('transaksi').select('*').eq('plat_nomor', plat).order('created_at', { ascending: false }).limit(3);
            if(error) return alert("Gagal cari nota: " + error.message);
            dataNotaTerakhir = data || [];
            const container = document.getElementById('notaList');
            container.innerHTML = '';

            if(dataNotaTerakhir.length === 0) {
                container.innerHTML = '<div style="color:#7f8c8d; font-size:13px; text-align:center; padding:30px;">Tidak ada nota aktif untuk armada ini.</div>';
                document.getElementById('uang_cash_disp').value = "0";
                updateDropdownSumberAgen([]);
                return;
            }

            dataNotaTerakhir.forEach(n => {
                const tglNota = new Date(n.created_at).toLocaleDateString('id-ID', { weekday: 'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
                const div = document.createElement('div');
                div.className = 'nota-item';
                div.innerHTML = `
                    <input type="checkbox" name="nota_pilih" value="${escHtml(n.no_nota)}" onchange="hitungOtomatis(); simpanDrafSetoran();">
                    <div class="nota-info">
                        <span class="txt-tgl">${escHtml(tglNota)}</span>
                        <div class="baris-bawah">
                            <span class="txt-agen">${escHtml(n.nama_agen || '-')}</span>
                            <span class="txt-nota">${escHtml(n.no_nota)}</span>
                        </div>
                    </div>`;
                container.appendChild(div);
            });

            document.getElementById('uang_cash_disp').value = "0";
            updateDropdownSumberAgen([]);
        } catch(err) { alert("Error cari nota: " + err.message); }
    }

    function updateDropdownSumberAgen(detailBundel) {
        const selSumber = document.getElementById('sumber_agen');
        const prevValue = selSumber.value;
        selSumber.innerHTML = '';

        if (detailBundel.length === 0) {
            selSumber.innerHTML = '<option value="">-- Pilih Nota Dahulu Di Atas --</option>';
            return;
        }

        detailBundel.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b.agen;
            opt.text = `${b.agen} [${b.nota}]`;
            selSumber.appendChild(opt);
        });

        if (prevValue && detailBundel.some(b => b.agen === prevValue)) {
            selSumber.value = prevValue;
        }
    }

    function hitungOtomatis() {
        const checked = Array.from(document.querySelectorAll('input[name="nota_pilih"]:checked'));
        let totalCash = 0; let detailBundel = [];
        let driver1_Set = new Set(); let driver2_Set = new Set();

        checked.forEach(cb => {
            const item = dataNotaTerakhir.find(x => x.no_nota === cb.value);
            if(item) {
                totalCash += parseInt(item.bayar_cash || 0, 10);
                detailBundel.push({ agen: item.nama_agen || "Tanpa Agen", nota: item.no_nota, cash: item.bayar_cash });

                let d1 = item.driver_1 || item.nama_driver || item.driver || "";
                let d2 = item.driver_2 || "";

                if(d1) driver1_Set.add(d1);
                if(d2) driver2_Set.add(d2);
            }
        });

        document.getElementById('uang_cash_disp').value = totalCash.toLocaleString('id-ID');

        let fixD1 = Array.from(driver1_Set).join(', ');
        let fixD2 = Array.from(driver2_Set).join(', ');

        updateDropdownSumberAgen(detailBundel);

        return {
            detail: detailBundel,
            drv1: fixD1.trim() !== "" ? fixD1 : "Driver SBR",
            drv2: fixD2.trim() !== "" ? fixD2 : "-",
            rawTotal: totalCash
        };
    }

    function formatPesanWA(opts) {
        const judulHeader = opts.isRevisi ? "*LAPORAN SETORAN DRIVER (REVISI)*" : "*LAPORAN SETORAN DRIVER*";
        const footerPesan = opts.isRevisi ? "_Data sukses diperbarui (replace) ke Supabase SBR_" : "_Data sudah sukses masuk ke database SBR_";

        let pesan = judulHeader + "\n";
        pesan += "----------------------------\n";
        pesan += "- *Tgl:* " + opts.tgl + "\n";
        pesan += "- *Driver 1:* " + opts.drv1 + "\n";
        pesan += "- *Driver 2:* " + opts.drv2 + "\n";
        pesan += "- *Unit:* " + opts.plat + "\n";
        pesan += "- *Odo:* " + Number(opts.kmRaw || 0).toLocaleString('id-ID') + " KM\n\n";

        pesan += "*RINCIAN BUNDEL CASH:*\n";
        if (opts.detail && opts.detail.length > 0) {
            opts.detail.forEach(b => {
                pesan += "- " + b.agen + " (" + b.nota + "): *Rp " + parseInt(b.cash || 0, 10).toLocaleString('id-ID') + "*\n";
            });
            pesan += "- *Total Kotor:* Rp " + Number(opts.rawTotal || 0).toLocaleString('id-ID') + "\n\n";
        } else {
            pesan += "- " + (opts.namaAgen || "-") + " (" + (opts.noNota || "-") + ")\n\n";
        }

        pesan += "*PENGELUARAN JALAN:*\n";
        pesan += "- *Beban Kas:* " + (opts.pilihanAgen || "-") + "\n";
        pesan += "- Uang Jalan: Rp " + Number(opts.uJalan || 0).toLocaleString('id-ID') + "\n";
        pesan += "- BBM/Solar: Rp " + Number(opts.uBBM || 0).toLocaleString('id-ID') + "\n";
        pesan += "- Bongkar: Rp " + Number(opts.uBongkar || 0).toLocaleString('id-ID') + "\n";
        pesan += "- Lain-lain (" + (opts.ketLain || "-") + "): Rp " + Number(opts.nomLain || 0).toLocaleString('id-ID') + "\n";

        pesan += "----------------------------\n";
        pesan += "- *Total Biaya:* Rp " + Number(opts.totalExp || 0).toLocaleString('id-ID') + "\n";
        if (opts.detail && opts.detail.length > 0) {
            pesan += "- *SISA SETOR:* Rp " + Number(opts.sisaBersih || 0).toLocaleString('id-ID') + "\n\n";
        } else {
            pesan += "\n";
        }
        pesan += footerPesan;
        return pesan;
    }

    async function setorDataHariIni() {
        if (sedangMenyimpan) return;
        const plat = document.getElementById('selMobil').value;
        const kmRaw = getAngka(document.getElementById('km_input').value);
        const checked = Array.from(document.querySelectorAll('input[name="nota_pilih"]:checked'));
        const pilihanAgen = document.getElementById('sumber_agen').value;

        if(!plat) return alert("Pengecekan Gagal: Unit Armada belum dipilih!");
        if(checked.length === 0) return alert("Pengecekan Gagal: Anda belum memilih Nota harian!");
        if(!pilihanAgen) return alert("Pengecekan Gagal: Silakan pilih Agen sebagai sumber dana pengeluaran!");
        if(kmRaw === 0) return alert("Pengecekan Gagal: Angka Odometer KM kosong atau tidak valid!");

        // Validasi Odometer anti salah ketik
        const cekOdo = cekValidasiOdometer();
        if (!cekOdo.ok) {
            if (!confirm(cekOdo.msg + "\n\nTetap lanjutkan simpan dengan angka KM ini?")) return;
        }

        const btnSetor = document.querySelector('.btn-setor');
        sedangMenyimpan = true;
        if (btnSetor) { btnSetor.disabled = true; btnSetor.textContent = "⏳ MENYIMPAN DATA..."; }

        const calc = hitungOtomatis();

        const uJalan = getAngka(document.getElementById('exp_jalan').value);
        const uBBM = getAngka(document.getElementById('exp_bbm').value);
        const uBongkar = getAngka(document.getElementById('exp_bongkar').value);
        const ketLain = document.getElementById('exp_lain_ket').value || "-";
        const nomLain = getAngka(document.getElementById('exp_lain_nom').value);

        const totalExp = uJalan + uBBM + uBongkar + nomLain;
        const sisaBersih = calc.rawTotal - totalExp;

        const stringNoNota = calc.detail.map(d => d.nota).join(', ');
        const stringNamaAgen = calc.detail.map(d => d.agen).join(', ');

        try {
            const { data: cekData, error: errCek } = await _sb
                .from('rekap_laporan_driver')
                .select('no_nota')
                .eq('no_nota', stringNoNota)
                .limit(1);

            if (errCek) throw errCek;

            const isRevisi = (cekData && cekData.length > 0);

            const { error: errorInsert } = await _sb.from('rekap_laporan_driver').upsert([{
                no_nota: stringNoNota,
                nama_agen: stringNamaAgen,
                nama_driver: calc.drv1,
                driver_2: calc.drv2,
                plat_nomor: plat,
                km_input: kmRaw,
                uang_jalan: uJalan,
                uang_bbm: uBBM,
                uang_bongkar: uBongkar,
                lain_lain: nomLain,
                ket_lain_lain: ketLain,
                sumber_agen: pilihanAgen
            }], { onConflict: 'no_nota' });

            if (errorInsert) {
                alert("❌ SUPABASE MENOLAK DATA!\n\nKode: " + errorInsert.code + "\nPesan: " + errorInsert.message);
                return;
            }

            const { error: errKm } = await _sb.from('monitoring_kendaraan')
                .update({ km_saat_ini: kmRaw })
                .eq('plat_nomor', plat);
            if (errKm) console.warn("Gagal update KM armada:", errKm.message);

            // Hapus draf lokal karena sudah sukses tersimpan ke database
            hapusDrafSetoran(true);

            const tgl = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
            const pesan = formatPesanWA({
                isRevisi, tgl, drv1: calc.drv1, drv2: calc.drv2, plat, kmRaw,
                detail: calc.detail, rawTotal: calc.rawTotal, pilihanAgen,
                uJalan, uBBM, uBongkar, ketLain, nomLain, totalExp, sisaBersih
            });

            window.open("https://wa.me/?text=" + encodeURIComponent(pesan), '_blank');

            setTimeout(function() {
                location.reload();
            }, 1500);

        } catch (e) {
            alert("⚠️ SISTEM SCRIPT ERROR MENDADAK!\n\nAlasan: " + e.message);
        } finally {
            sedangMenyimpan = false;
            if (btnSetor) { btnSetor.disabled = false; btnSetor.textContent = "🚀 SIMPAN & KIRIM WA"; }
        }
    }

    /* ============ RIWAYAT SETORAN TERAKHIR + KIRIM ULANG WA ============ */
    async function loadRiwayatSetoran() {
        const box = document.getElementById('riwayatSetoranList');
        const scopeLabel = document.getElementById('riwayatScopeLabel');
        try {
            let rows = [];
            const role = (localStorage.getItem('userRole') || '').toLowerCase();
            if (userLogin && userLogin !== 'Driver' && role !== 'admin') {
                const escaped = userLogin.replace(/[%_\\]/g, '\\$&');
                const { data, error } = await _sb
                    .from('rekap_laporan_driver')
                    .select('*')
                    .or(`nama_driver.ilike.%${escaped}%,driver_2.ilike.%${escaped}%`)
                    .order('created_at', { ascending: false })
                    .limit(5);
                if (error) throw error;
                rows = data || [];
                scopeLabel.textContent = `Driver: ${userLogin}`;
            }

            if (rows.length === 0) {
                const { data, error } = await _sb
                    .from('rekap_laporan_driver')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(5);
                if (error) throw error;
                rows = data || [];
                scopeLabel.textContent = '5 Terakhir';
            }

            riwayatSetoranCache = rows;
            if (rows.length === 0) {
                box.innerHTML = '<div class="hist-card" style="text-align:center; color:#64748b; font-size:13px;">Belum ada riwayat setoran tersimpan.</div>';
                return;
            }

            box.innerHTML = rows.map((r, idx) => {
                const tglStr = r.created_at
                    ? new Date(r.created_at).toLocaleString('id-ID', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
                    : '-';
                const totalBiaya = Number(r.uang_jalan || 0) + Number(r.uang_bbm || 0) + Number(r.uang_bongkar || 0) + Number(r.lain_lain || 0);
                const statusBadge = r.status_setoran
                    ? '<span class="badge-status badge-ok">✅ Sudah Diterima Admin</span>'
                    : '<span class="badge-status badge-wait">⏳ Belum Verifikasi</span>';

                return `
                    <div class="hist-card">
                        <div class="hist-top">
                            <span class="hist-date">${escHtml(tglStr)} WIB</span>
                            ${statusBadge}
                        </div>
                        <div class="hist-main">${escHtml(r.nama_agen || '-')} <span style="color:#64748b; font-size:13px;">(${escHtml(r.no_nota || '-')})</span></div>
                        <div class="hist-sub">
                            🚛 <b>${escHtml(r.plat_nomor || '-')}</b> · Odo: <b>${Number(r.km_input || 0).toLocaleString('id-ID')} KM</b><br>
                            👤 ${escHtml(r.nama_driver || '-')}${r.driver_2 && r.driver_2 !== '-' ? ' &amp; ' + escHtml(r.driver_2) : ''}<br>
                            💸 Total Biaya Jalan: <b>Rp ${totalBiaya.toLocaleString('id-ID')}</b> (Kas: ${escHtml(r.sumber_agen || '-')})
                        </div>
                        <button type="button" class="btn-resend-wa" onclick="kirimUlangWA(${idx})">📲 Kirim Ulang WA</button>
                    </div>`;
            }).join('');
        } catch (err) {
            box.innerHTML = `<div class="hist-card" style="color:#b91c1c; font-size:13px;">Gagal memuat riwayat: ${escHtml(err.message)}</div>`;
        }
    }

    async function kirimUlangWA(idx) {
        const r = riwayatSetoranCache[idx];
        if (!r) return;
        const uJalan = Number(r.uang_jalan || 0);
        const uBBM = Number(r.uang_bbm || 0);
        const uBongkar = Number(r.uang_bongkar || 0);
        const nomLain = Number(r.lain_lain || 0);
        const totalExp = uJalan + uBBM + uBongkar + nomLain;

        // Coba ambil detail cash dari tabel transaksi agar SISA SETOR ikut tampil akurat
        let detail = [];
        let rawTotal = 0;
        const notaList = String(r.no_nota || '').split(/[,;/]+/).map(s => s.trim()).filter(Boolean);
        if (notaList.length > 0) {
            try {
                const { data: txRows } = await _sb
                    .from('transaksi')
                    .select('no_nota, nama_agen, bayar_cash')
                    .in('no_nota', notaList);
                if (txRows && txRows.length > 0) {
                    detail = txRows.map(tx => ({
                        agen: tx.nama_agen || 'Tanpa Agen',
                        nota: tx.no_nota,
                        cash: Number(tx.bayar_cash || 0)
                    }));
                    rawTotal = detail.reduce((sum, x) => sum + x.cash, 0);
                }
            } catch (e) {}
        }

        const tglObj = r.created_at ? new Date(r.created_at) : new Date();
        const tgl = tglObj.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
        const pesan = formatPesanWA({
            isRevisi: false,
            tgl,
            drv1: r.nama_driver || 'Driver SBR',
            drv2: r.driver_2 || '-',
            plat: r.plat_nomor || '-',
            kmRaw: Number(r.km_input || 0),
            detail,
            rawTotal,
            namaAgen: r.nama_agen,
            noNota: r.no_nota,
            pilihanAgen: r.sumber_agen || '-',
            uJalan, uBBM, uBongkar,
            ketLain: r.ket_lain_lain || '-',
            nomLain,
            totalExp,
            sisaBersih: rawTotal - totalExp
        });
        window.open("https://wa.me/?text=" + encodeURIComponent(pesan), '_blank');
    }

    window.onload = () => {
        document.getElementById('welcomeNama').innerText = "HALO, " + userLogin.toUpperCase() + "!";
        loadArmada();
        loadRiwayatSetoran();
    };
</script>
