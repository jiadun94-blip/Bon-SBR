<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Monitoring Pengiriman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load Supabase JS Client dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg:#e6f0fb; --panel:#edf5ff; --ink:#203b63; --muted:#6683aa;
            --blue:#2589f5; --blue2:#4ba0ff; --green:#12a879; --green2:#28c18d;
            --yellow:#f3ad16; --line:#d8e7f8;
            --shadow: 8px 8px 20px rgba(145,174,208,.28), -7px -7px 18px rgba(255,255,255,.88);
            --inset: inset 4px 4px 9px rgba(153,180,211,.23), inset -4px -4px 9px rgba(255,255,255,.85);
        }
        * { box-sizing:border-box; }
        body {
            margin:0; padding-bottom:100px; color:var(--ink);
            background:linear-gradient(145deg,#eaf3ff 0%,#e1edf9 55%,#edf6ff 100%);
            font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;
        }
        .container { max-width:900px; padding:20px 14px 28px; }
        .brand-header {
            display:flex; align-items:center; justify-content:space-between; gap:14px;
            margin:0 2px 22px; padding:10px 4px;
        }
        .brand-logo { display:block; width:min(72%, 330px); max-height:88px; object-fit:contain; object-position:left center; }
        .brand-badge {
            display:flex; align-items:center; gap:7px; flex-shrink:0; padding:9px 12px;
            border:1px solid rgba(255,255,255,.8); border-radius:20px;
            background:rgba(240,247,255,.72); color:var(--muted); font-size:.75rem; font-weight:700;
            box-shadow:4px 4px 12px rgba(145,174,208,.2),-4px -4px 12px white;
        }
        .page-title { display:flex; align-items:center; gap:14px; margin:0 4px 22px; }
        .title-icon {
            display:grid; place-items:center; flex:0 0 58px; width:58px; height:58px;
            border-radius:20px; background:linear-gradient(145deg,#dceeff,#c9e3ff);
            color:var(--blue); font-size:1.65rem; box-shadow:var(--shadow);
        }
        .page-title h4 { margin:0; color:#1d3c68; font-size:clamp(1.3rem,4vw,1.8rem); font-weight:850; letter-spacing:-.04em; }
        #tanggalHariIni { margin:5px 0 0; color:var(--muted)!important; font-size:.84rem; font-weight:600; }
        .page-subtitle { margin:5px 0 0; color:#5e7fa9; font-size:.88rem; line-height:1.5; }
        .card {
            border:1px solid rgba(255,255,255,.85); border-radius:22px; overflow:hidden;
            background:rgba(241,247,255,.78); box-shadow:var(--shadow); margin-bottom:20px!important;
        }
        .card-header {
            display:flex; align-items:center; gap:12px; padding:14px 16px;
            border:0; border-radius:18px!important; margin:9px 9px 0;
            color:#0069d9!important; background:linear-gradient(100deg,#d9ebff,#e7f2ff)!important;
            font-weight:800; font-size:1rem;
        }
        .card-header.bg-success { color:#078b63!important; background:linear-gradient(100deg,#d8f7eb,#e8f9f3)!important; }
        .section-icon { display:grid; place-items:center; width:42px; height:42px; flex:0 0 42px; border-radius:14px; color:white; background:linear-gradient(145deg,#52a8ff,#1878ed); box-shadow:0 5px 12px rgba(37,137,245,.25); font-size:1.2rem; }
        .card-header.bg-success .section-icon { background:linear-gradient(145deg,#31d2a0,#0ca678); box-shadow:0 5px 12px rgba(18,168,121,.22); }
        .card-body { padding:16px; }
        .card-footer { padding:14px 17px 17px!important; border-top:1px solid rgba(255,255,255,.8)!important; background:rgba(220,235,252,.5)!important; }
        .form-label { color:#5f7da5!important; font-size:.8rem; font-weight:750!important; }
        .form-control,.form-select {
            min-height:46px; border:1px solid #d9e8f9; border-radius:13px; padding:10px 12px;
            color:#24466f; background:#edf5ff; box-shadow:var(--inset)!important; font-size:.9rem;
        }
        .form-control::placeholder { color:#7d9bc0; opacity:1; }
        .form-control:focus,.form-select:focus { border-color:#85bdff; background:#f3f8ff; box-shadow:var(--inset),0 0 0 3px rgba(37,137,245,.12)!important; }
        .form-control[readonly] { background:#e3edf9!important; color:#54749d; }
        .row.baris-armada,.row.baris-agen { align-items:center; margin:0 0 12px; padding:9px; border:1px solid rgba(255,255,255,.9); border-radius:15px; background:rgba(244,249,255,.6); }
        .btn-tambah { min-height:43px; border:0!important; border-radius:13px; color:white!important; font-weight:800; background:linear-gradient(100deg,#54aaff,#2688f5)!important; box-shadow:0 5px 12px rgba(37,137,245,.2); }
        #btnTambahAgen { background:linear-gradient(100deg,#31c995,#0fa879)!important; box-shadow:0 5px 12px rgba(18,168,121,.18); }
        .btn-hapus { width:42px; min-width:42px; border-radius:12px; font-weight:800; }
        .mb-3.p-3.bg-light.rounded-3.border { border:1px solid #d8f0e7!important; border-radius:16px!important; background:linear-gradient(120deg,#e0f7ee,#edf9f5)!important; box-shadow:var(--inset); }
        #inputAcuanBarang { background:#f0fbf7!important; }
        .filter-toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
        .filter-pills { display:flex; flex-wrap:wrap; gap:6px; }
        .filter-actions { display:flex; flex-wrap:wrap; gap:6px; }
        .pill-btn {
            border:1px solid #bfe6d7; border-radius:999px; padding:5px 11px;
            background:#f4fcf9; color:#2b6b57; font-size:.76rem; font-weight:750;
            cursor:pointer; transition:all .15s ease;
        }
        .pill-btn.active { background:linear-gradient(100deg,#31c995,#0fa879); color:#fff; border-color:transparent; box-shadow:0 3px 8px rgba(18,168,121,.22); }
        .btn-auto-fill, .btn-refresh-nota {
            border:1px solid #9bd8c1; border-radius:11px; padding:5px 11px;
            background:#ffffff; color:#0c8560; font-size:.76rem; font-weight:800;
            cursor:pointer; box-shadow:0 2px 6px rgba(18,168,121,.12);
        }
        .btn-auto-fill:hover, .btn-refresh-nota:hover { background:#e7f9f2; }
        .btn-refresh-nota:disabled { opacity:.6; cursor:wait; }
        .custom-range-box {
            display:none; flex-wrap:wrap; align-items:end; gap:8px;
            margin-top:10px; padding:10px; border:1px solid #c6e8da; border-radius:12px;
            background:rgba(255,255,255,.72);
        }
        .custom-range-box.show { display:flex; }
        .custom-range-field { flex:1 1 130px; min-width:120px; }
        .custom-range-field label { display:block; font-size:.7rem; font-weight:750; color:#3d6f5d; margin-bottom:3px; }
        .custom-range-field input[type="date"] {
            min-height:38px; padding:6px 9px; font-size:.82rem; border-radius:10px; background:#fff!important;
        }
        .btn-apply-range {
            min-height:38px; border:0; border-radius:10px; padding:0 14px;
            background:linear-gradient(100deg,#31c995,#0fa879); color:#fff;
            font-size:.8rem; font-weight:800; cursor:pointer; box-shadow:0 3px 8px rgba(18,168,121,.2);
        }
        .nota-status-hint { font-size:.75rem; color:#4f7668; font-weight:600; margin-top:6px; }
        .selisih-box { border:1px solid rgba(255,255,255,.8)!important; border-radius:19px; background:linear-gradient(120deg,#fff4d4,#fff0c1)!important; box-shadow:var(--shadow); }
        .selisih-box .card-body { padding:18px; }
        .selisih-box .fw-bold:first-child { color:#8a6714!important; }
        #displaySelisih { font-size:1.9rem!important; }
        .sticky-bottom-bar {
            position:fixed; z-index:1030; bottom:0; left:0; right:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
            border-top:1px solid rgba(255,255,255,.85); border-radius:20px 20px 0 0;
            background:rgba(232,241,252,.9); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
            box-shadow:0 -7px 22px rgba(104,143,188,.15);
        }
        #btnKirimWA { min-height:52px; border:0; border-radius:15px; background:linear-gradient(100deg,#2fc995,#0da777); box-shadow:0 6px 15px rgba(18,168,121,.24)!important; font-size:.97rem; }
        @media(min-width:600px) {
            .container { padding-top:28px; }
            .sticky-bottom-bar { padding-left:max(14px,calc((100vw - 872px)/2)); padding-right:max(14px,calc((100vw - 872px)/2)); }
        }
        @media(max-width:420px) {
            .container { padding-left:10px; padding-right:10px; }
            .brand-header { margin-bottom:16px; }
            .brand-logo { width:66%; max-height:62px; }
            .brand-badge { padding:7px 8px; font-size:.68rem; }
            .page-title { gap:10px; }
            .title-icon { width:48px; height:48px; flex-basis:48px; border-radius:16px; }
            .card-body { padding:12px; }
            .card-header { padding:11px 12px; }
            .form-control,.form-select { padding-left:9px; padding-right:7px; font-size:.82rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="brand-header">
        <img class="brand-logo" src="logo.png" alt="SBRdigital - Lembang Bandung Barat">
        <div class="brand-badge">📅 <span id="tanggalHariIni"></span></div>
    </header>
    <div class="page-title">
        <div class="title-icon" aria-hidden="true">🚚</div>
        <div>
            <h4>Monitoring Pengiriman</h4>
            <p class="page-subtitle">Kelola armada, distribusi nota, dan pantau selisih barang dengan mudah.</p>
        </div>
    </div>

    <!-- CARD ARMADA -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold">
            <span class="section-icon" aria-hidden="true">🚚</span>
            <span>Data Armada & Total Bawaan</span>
        </div>
        <div class="card-body" id="containerArmada">
            <label class="form-label text-muted small fw-bold">Daftar Armada & Kiriman Dibawa</label>

            <div class="row mb-3 baris-armada">
                <div class="col-8 pe-1">
                    <select class="form-select select-armada">
                        <option value="">-- Pilih Kendaraan --</option>
                        <option value="D 1621 PH ( GM Mini )">D 1621 PH ( GM Mini )</option>
                        <option value="D 8740 UI ( GM Van 03 )">D 8740 UI ( GM Van 03 )</option>
                        <option value="D 8976 FR ( GM Box 1 )">D 8976 FR ( GM Box 1 )</option>
                        <option value="AE 8340 KE ( Traga Van )">AE 8340 KE ( Traga Van )</option>
                        <option value="D 8607 FN ( Traga Box )">D 8607 FN ( Traga Box )</option>
                        <option value="D 8132 TP ( GM box 2 )">D 8132 TP ( GM box 2 )</option>
                        <option value="D 1234 S ( free )">D 1234 SBR ( free ) - Pick up</option>
                        <option value="D 4444 SBR ( BALLEN )">D 4444 SBR ( BALLEN )</option>
                        <option value="D 5555 SBR ( ANGGARA )">D 5555 SBR ( ANGGARA )</option>
                         <option value="E 8655 VN ( Traga Box 2 )">E 8655 VN ( Traga Box 2)</option>
                        <option value="SUSULAN">SUSULAN</option>
                    </select>
                </div>
                <div class="col-4 ps-1">
                    <input type="number" class="form-control input-qty-bawa" placeholder="Bawa">
                </div>
            </div>

            <button class="btn btn-sm btn-outline-primary w-100 btn-tambah" id="btnTambahArmada">+ Tambah Armada</button>
        </div>
        <div class="card-footer text-end bg-white border-0 pb-3 rounded-bottom">
            <span class="fw-bold text-secondary">Total Bawaan: </span>
            <span class="fw-bold fs-5 text-primary" id="displayTotalBawa">0</span>
        </div>
    </div>

    <!-- CARD AGEN / NOTA -->
    <div class="card mb-4">
        <div class="card-header bg-success text-white fw-bold">
            <span class="section-icon" aria-hidden="true">📦</span>
            <span>Distribusi Data Berdasarkan Nota</span>
        </div>
        <div class="card-body" id="containerAgen">

            <!-- INPUT ACUAN NAMA BARANG DI ATAS -->
            <div class="mb-3 p-3 bg-light rounded-3 border">
                <label for="inputAcuanBarang" class="form-label text-success fw-bold small mb-1">🏷️ Acuan Nama Barang yang Dicari:</label>
                <input type="text" class="form-control form-control-sm bg-white" id="inputAcuanBarang" list="listAcuanBarang" value="Makroni 2000" placeholder="Masukkan nama barang...">
                <datalist id="listAcuanBarang">
                    <option value="Makroni 2000"></option>
                </datalist>
                <div class="filter-toolbar">
                    <div class="filter-pills" role="group" aria-label="Filter rentang tanggal nota">
                        <button type="button" class="pill-btn" id="btnFilterHariIni" data-range="today">Hari Ini</button>
                        <button type="button" class="pill-btn active" id="btnFilter2Hari" data-range="2days">Hari Ini &amp; Kemarin</button>
                        <button type="button" class="pill-btn" id="btnFilterCustom" data-range="custom">📅 Pilih Rentang</button>
                    </div>
                    <div class="filter-actions">
                        <button type="button" class="btn-refresh-nota" id="btnRefreshNota" title="Ambil nota &amp; armada terbaru tanpa reload halaman">🔄 Refresh</button>
                        <button type="button" class="btn-auto-fill" id="btnMuatSemuaNota">⚡ Muat Semua Nota</button>
                    </div>
                </div>
                <div class="custom-range-box" id="customRangeBox">
                    <div class="custom-range-field">
                        <label for="inputTglMulai">Dari Tanggal</label>
                        <input type="date" class="form-control form-control-sm" id="inputTglMulai">
                    </div>
                    <div class="custom-range-field">
                        <label for="inputTglSampai">Sampai Tanggal</label>
                        <input type="date" class="form-control form-control-sm" id="inputTglSampai">
                    </div>
                    <button type="button" class="btn-apply-range" id="btnTerapkanRentang">Terapkan</button>
                </div>
                <div class="nota-status-hint" id="notaFilterHint">Memuat daftar nota dari database...</div>
            </div>

            <!-- TAMBAHAN KOLOM GUDANG -->
            <label class="form-label text-muted small fw-bold">Alokasi Gudang</label>
            <div class="row mb-3">
                <div class="col-8 pe-1">
                    <input type="text" class="form-control bg-light fw-bold text-secondary" value="GUDANG" readonly>
                </div>
                <div class="col-4 ps-1">
                    <input type="number" class="form-control" id="inputQtyGudang" placeholder="Qty">
                </div>
            </div>

            <hr class="text-muted opacity-25">

            <label class="form-label text-muted small fw-bold">Pilih No Nota (Nama Agen & Qty Muncul Otomatis)</label>

            <div class="row mb-3 baris-agen">
                <div class="col-8 pe-1">
                    <select class="form-select select-nota">
                        <option value="">-- Pilih No Nota & Agen --</option>
                        <!-- Opsi akan dimuat otomatis dari database -->
                    </select>
                </div>
                <div class="col-4 ps-1">
                    <input type="number" class="form-control input-qty-agen" placeholder="Qty">
                </div>
            </div>

            <button class="btn btn-sm btn-outline-success w-100 btn-tambah" id="btnTambahAgen">+ Tambah Baris Nota</button>
        </div>
        <div class="card-footer text-end bg-white border-0 pb-3 rounded-bottom">
            <span class="fw-bold text-secondary">Total Distribusi: </span>
            <span class="fw-bold fs-5 text-success" id="displayTotalAgen">0</span>
        </div>
    </div>

    <!-- SELISIH -->
    <div class="card mb-4 border-0 selisih-box" style="background-color: #fff3cd;">
        <div class="card-body d-flex justify-content-between align-items-center">
            <span class="fw-bold text-warning-emphasis">Selisih (Distribusi - Bawaan):</span>
            <span class="fw-bold fs-3 text-danger" id="displaySelisih">0</span>
        </div>
    </div>

</div>

<!-- TOMBOL WA -->
<div class="sticky-bottom-bar">
    <button class="btn btn-success btn-lg w-100 fw-bold shadow-sm" id="btnKirimWA">
        Kirim Rekap via WhatsApp
    </button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async function() {

        // 1. INISIALISASI SUPABASE MENGGUNAKAN KEY YANG BARU
        let supabaseClient = null;
        try {
            const SB_URL = "https://wunnynznajgwltzqdvfi.supabase.co";
            const SB_KEY = "sb_publishable_HJGWlUbTi-sT6tpFU4eZ1g_um4hmtVd";

            if (typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
            }
        } catch (error) {
            console.error("Gagal menghubungkan ke database:", error);
        }

        // 2. SET TANGGAL HARI INI
        const elTanggal = document.getElementById("tanggalHariIni");
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        elTanggal.textContent = new Date().toLocaleDateString('id-ID', options);

        // 3. AMBIL DATA NOTA & DETAIL KIRIM DARI SUPABASE (1x Muat, Filter Instan di Memori)
        const displayTotalBawa = document.getElementById("displayTotalBawa");
        const displayTotalAgen = document.getElementById("displayTotalAgen");
        const displaySelisih = document.getElementById("displaySelisih");
        const inputAcuanBarang = document.getElementById("inputAcuanBarang");
        const inputQtyGudang = document.getElementById("inputQtyGudang");
        const listAcuanBarang = document.getElementById("listAcuanBarang");
        const notaFilterHint = document.getElementById("notaFilterHint");
        const btnFilterHariIni = document.getElementById("btnFilterHariIni");
        const btnFilter2Hari = document.getElementById("btnFilter2Hari");
        const btnFilterCustom = document.getElementById("btnFilterCustom");
        const customRangeBox = document.getElementById("customRangeBox");
        const inputTglMulai = document.getElementById("inputTglMulai");
        const inputTglSampai = document.getElementById("inputTglSampai");
        const btnTerapkanRentang = document.getElementById("btnTerapkanRentang");
        const btnRefreshNota = document.getElementById("btnRefreshNota");
        const btnMuatSemuaNota = document.getElementById("btnMuatSemuaNota");
        const containerAgen = document.getElementById("containerAgen");
        const btnTambahAgen = document.getElementById("btnTambahAgen");
        let armadaOptionsHTML = document.querySelector(".select-armada")?.innerHTML || `<option value="">-- Pilih Kendaraan --</option>`;

        const formatLocalDate = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const nowDate = new Date();
        const tglHariIni = formatLocalDate(nowDate);
        const tglKemarinDate = new Date(nowDate);
        tglKemarinDate.setDate(tglKemarinDate.getDate() - 1);
        const tglKemarin = formatLocalDate(tglKemarinDate);

        inputTglMulai.value = tglKemarin;
        inputTglSampai.value = tglHariIni;

        let recentNotas = [];
        let customNotas = [];
        const customRangeCache = new Map();
        const barangSet = new Set(["Makroni 2000"]);
        // Map: no_nota -> Map(nama_barang_lower -> totalQty)
        const detailQtyMap = new Map();
        let activeDateRange = "2days"; // "today" | "2days" | "custom"
        let filteredNotas = [];
        let notaOptionsHTML = `<option value="">-- Pilih No Nota & Agen --</option>`;

        function escapeHtml(str) {
            return String(str ?? "").replace(/[&<>"']/g, ch => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
            }[ch]));
        }

        function formatTanggalSingkat(tglStr) {
            if (!tglStr) return "";
            const parts = String(tglStr).split("-");
            if (parts.length !== 3) return tglStr;
            const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
            const mIdx = parseInt(parts[1], 10) - 1;
            return `${parseInt(parts[2], 10)} ${bulan[mIdx] || parts[1]}`;
        }

        function getQtyForNota(noNota, namaBarang) {
            const itemMap = detailQtyMap.get(noNota);
            if (!itemMap) return 0;
            return itemMap.get(String(namaBarang || "").trim().toLowerCase()) || 0;
        }

        function renderBarangDatalist() {
            listAcuanBarang.innerHTML = [...barangSet]
                .sort((a, b) => a.localeCompare(b, 'id'))
                .map(b => `<option value="${escapeHtml(b)}"></option>`)
                .join("");
        }

        async function fetchRangeFromDb(startDate, endDate) {
            if (!supabaseClient) return [];
            const { data: dataNota, error } = await supabaseClient
                .from('transaksi')
                .select('no_nota, nama_agen, tanggal')
                .gte('tanggal', startDate)
                .lte('tanggal', endDate)
                .order('id', { ascending: false });

            if (error) throw error;
            const listNota = dataNota || [];

            const missingNotas = [...new Set(listNota.map(n => n.no_nota).filter(no => no && !detailQtyMap.has(no)))];
            const chunkSize = 100;
            for (let i = 0; i < missingNotas.length; i += chunkSize) {
                const chunk = missingNotas.slice(i, i + chunkSize);
                chunk.forEach(no => {
                    if (!detailQtyMap.has(no)) detailQtyMap.set(no, new Map());
                });
                const { data: dataDetailChunk, error: errDet } = await supabaseClient
                    .from('transaksi_detail')
                    .select('no_nota, nama_barang, qty')
                    .in('no_nota', chunk)
                    .eq('tipe', 'Kirim');

                if (errDet) {
                    console.error("Gagal memuat detail barang:", errDet);
                    continue;
                }
                (dataDetailChunk || []).forEach(d => {
                    const noNota = d.no_nota;
                    const namaBrg = String(d.nama_barang || "").trim();
                    const qtyNum = parseFloat(d.qty) || 0;
                    if (!noNota || !namaBrg) return;
                    barangSet.add(namaBrg);
                    if (!detailQtyMap.has(noNota)) detailQtyMap.set(noNota, new Map());
                    const m = detailQtyMap.get(noNota);
                    const key = namaBrg.toLowerCase();
                    m.set(key, (m.get(key) || 0) + qtyNum);
                });
            }
            renderBarangDatalist();
            return listNota;
        }

        function filterByBarang(list, namaBarang) {
            const keyBarang = String(namaBarang || "").trim().toLowerCase();
            if (!keyBarang) return list;
            return list.filter(item => getQtyForNota(item.no_nota, keyBarang) > 0);
        }

        function getFilteredNotas(rangeMode, namaBarang) {
            let source = recentNotas;
            if (rangeMode === "today") {
                source = recentNotas.filter(item => item.tanggal === tglHariIni);
            } else if (rangeMode === "2days") {
                source = recentNotas.filter(item => item.tanggal >= tglKemarin && item.tanggal <= tglHariIni);
            } else if (rangeMode === "custom") {
                source = customNotas;
            }
            return filterByBarang(source, namaBarang);
        }

        function buildNotaOptionsHTML(list, namaBarang) {
            const labelBarang = String(namaBarang || "").trim();
            if (!list.length) {
                return `<option value="">-- Tidak ada nota ${escapeHtml(labelBarang || "sesuai filter")} --</option>`;
            }
            let html = `<option value="">-- Pilih Agen (${list.length} nota ${escapeHtml(labelBarang)}) --</option>`;
            list.forEach(item => {
                const agenClean = String(item.nama_agen || "").trim();
                const qty = getQtyForNota(item.no_nota, labelBarang);
                let tglLabel = formatTanggalSingkat(item.tanggal);
                if (item.tanggal === tglHariIni) tglLabel = "Hari ini";
                else if (item.tanggal === tglKemarin) tglLabel = "Kemarin";
                html += `<option value="${escapeHtml(item.no_nota)}" data-agen="${escapeHtml(agenClean)}" data-qty="${qty}">${escapeHtml(agenClean)} · Qty ${qty} (${escapeHtml(item.no_nota)} · ${escapeHtml(tglLabel)})</option>`;
            });
            return html;
        }

        async function loadArmadaFromDb() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('kendaraan')
                    .select('plat_nomor, tipe_mobil')
                    .order('plat_nomor', { ascending: true });
                if (error || !Array.isArray(data) || data.length === 0) return;

                let html = `<option value="">-- Pilih Kendaraan --</option>`;
                let hasSusulan = false;
                data.forEach(item => {
                    const plat = String(item.plat_nomor || "").trim();
                    const tipe = String(item.tipe_mobil || "").trim();
                    if (!plat) return;
                    const label = (plat.includes("(") || !tipe || plat.toLowerCase().includes(tipe.toLowerCase()))
                        ? plat
                        : `${plat} ( ${tipe} )`;
                    if (label.toUpperCase() === "SUSULAN") hasSusulan = true;
                    html += `<option value="${escapeHtml(label)}">${escapeHtml(label)}</option>`;
                });
                if (!hasSusulan) {
                    html += `<option value="SUSULAN">SUSULAN</option>`;
                }
                armadaOptionsHTML = html;

                document.querySelectorAll(".select-armada").forEach(sel => {
                    const prevVal = sel.value;
                    sel.innerHTML = armadaOptionsHTML;
                    if (prevVal) {
                        if (!Array.from(sel.options).some(o => o.value === prevVal)) {
                            const extra = document.createElement("option");
                            extra.value = prevVal;
                            extra.textContent = prevVal;
                            sel.appendChild(extra);
                        }
                        sel.value = prevVal;
                    }
                });
            } catch (err) {
                console.error("Gagal memuat daftar armada:", err);
            }
        }

        function syncDuplicateNotaOptions() {
            const selects = Array.from(document.querySelectorAll(".select-nota"));
            const selectedSet = new Set(selects.map(s => s.value).filter(Boolean));
            selects.forEach(sel => {
                const currentVal = sel.value;
                Array.from(sel.options).forEach(opt => {
                    if (!opt.value) return;
                    if (!opt.dataset.baseLabel) {
                        opt.dataset.baseLabel = opt.textContent;
                    }
                    const isUsedElsewhere = opt.value !== currentVal && selectedSet.has(opt.value);
                    opt.disabled = isUsedElsewhere;
                    opt.textContent = isUsedElsewhere
                        ? `${opt.dataset.baseLabel} — ✓ Sudah dipilih`
                        : opt.dataset.baseLabel;
                });
            });
        }

        function refreshDropdowns(preserveSelection = true, statusPrefix = "") {
            const namaBarang = inputAcuanBarang.value.trim();
            filteredNotas = getFilteredNotas(activeDateRange, namaBarang);
            notaOptionsHTML = buildNotaOptionsHTML(filteredNotas, namaBarang);

            const countToday = getFilteredNotas("today", namaBarang).length;
            const count2Days = getFilteredNotas("2days", namaBarang).length;
            btnFilterHariIni.textContent = `Hari Ini (${countToday})`;
            btnFilter2Hari.textContent = `Hari Ini & Kemarin (${count2Days})`;
            btnFilterHariIni.classList.toggle("active", activeDateRange === "today");
            btnFilter2Hari.classList.toggle("active", activeDateRange === "2days");
            btnFilterCustom.classList.toggle("active", activeDateRange === "custom");
            customRangeBox.classList.toggle("show", activeDateRange === "custom");

            let rangeLabel = "hari ini & kemarin";
            if (activeDateRange === "today") {
                rangeLabel = "hari ini";
            } else if (activeDateRange === "custom") {
                const s = inputTglMulai.value || tglKemarin;
                const e = inputTglSampai.value || tglHariIni;
                rangeLabel = s === e ? formatTanggalSingkat(s) : `${formatTanggalSingkat(s)} – ${formatTanggalSingkat(e)}`;
            }

            const baseMsg = filteredNotas.length
                ? `Menampilkan ${filteredNotas.length} agen dengan barang "${namaBarang || "semua"}" (${rangeLabel}).`
                : `Belum ada nota dengan barang "${namaBarang || "-"}" (${rangeLabel}).`;
            notaFilterHint.textContent = statusPrefix ? `${statusPrefix} · ${baseMsg}` : baseMsg;

            document.querySelectorAll(".baris-agen").forEach(row => {
                const selectNota = row.querySelector(".select-nota");
                const inputQty = row.querySelector(".input-qty-agen");
                const prevVal = preserveSelection ? selectNota.value : "";

                selectNota.innerHTML = notaOptionsHTML;
                if (prevVal && Array.from(selectNota.options).some(opt => opt.value === prevVal)) {
                    selectNota.value = prevVal;
                    inputQty.value = getQtyForNota(prevVal, namaBarang);
                } else if (prevVal) {
                    inputQty.value = "";
                }
            });
            syncDuplicateNotaOptions();
            hitungTotalAgen();
        }

        async function applyCustomDateRange(forceRefresh = false, statusPrefix = "") {
            let start = inputTglMulai.value || tglKemarin;
            let end = inputTglSampai.value || tglHariIni;
            if (start > end) {
                const tmp = start;
                start = end;
                end = tmp;
                inputTglMulai.value = start;
                inputTglSampai.value = end;
            }
            const cacheKey = `${start}|${end}`;
            if (!forceRefresh && customRangeCache.has(cacheKey)) {
                customNotas = customRangeCache.get(cacheKey);
                refreshDropdowns(true, statusPrefix);
                return;
            }
            notaFilterHint.textContent = `Memuat nota ${formatTanggalSingkat(start)} – ${formatTanggalSingkat(end)}...`;
            try {
                const fetched = await fetchRangeFromDb(start, end);
                customRangeCache.set(cacheKey, fetched);
                customNotas = fetched;
                refreshDropdowns(true, statusPrefix);
            } catch (err) {
                console.error("Gagal memuat nota rentang tanggal:", err);
                notaFilterHint.textContent = "Gagal memuat nota untuk rentang tanggal yang dipilih.";
            }
        }

        if (supabaseClient) {
            try {
                const [fetchedRecent] = await Promise.all([
                    fetchRangeFromDb(tglKemarin, tglHariIni),
                    loadArmadaFromDb()
                ]);
                recentNotas = fetchedRecent;
                customRangeCache.set(`${tglKemarin}|${tglHariIni}`, recentNotas);
                customNotas = recentNotas;
                refreshDropdowns(false);
            } catch (err) {
                console.error("Gagal memuat daftar nota:", err);
                notaFilterHint.textContent = "Gagal memuat daftar nota dari database.";
            }
        }

        // 4. HITUNG SELISIH DAN TOTAL
        function hitungSelisih() {
            const bawa = parseFloat(displayTotalBawa.textContent) || 0;
            const agen = parseFloat(displayTotalAgen.textContent) || 0;
            const selisih = agen - bawa; 

            displaySelisih.textContent = selisih;
            if (selisih !== 0) {
                displaySelisih.className = "fw-bold fs-3 text-danger";
            } else {
                displaySelisih.className = "fw-bold fs-3 text-success";
            }
        }

        function hitungTotalBawa() {
            let total = 0;
            document.querySelectorAll(".input-qty-bawa").forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val)) total += val;
            });
            displayTotalBawa.textContent = total;
            hitungSelisih();
        }

        function hitungTotalAgen() {
            let total = 0;

            const qtyGudang = parseFloat(inputQtyGudang.value);
            if (!isNaN(qtyGudang)) {
                total += qtyGudang;
            }

            document.querySelectorAll(".input-qty-agen").forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val)) total += val;
            });

            displayTotalAgen.textContent = total;
            hitungSelisih();
        }

        inputQtyGudang.addEventListener("input", hitungTotalAgen);

        // FUNGSI TARIK QTY INSTAN BERDASARKAN NOTA YANG DIPILIH
        function tarikQtyBerdasarkanNota(row) {
            const selectNota = row.querySelector(".select-nota");
            const inputQty = row.querySelector(".input-qty-agen");
            const noNotaCari = selectNota.value;

            if (noNotaCari !== "") {
                const selectedOpt = selectNota.options[selectNota.selectedIndex];
                const cachedQty = selectedOpt ? selectedOpt.getAttribute("data-qty") : null;
                if (cachedQty !== null && cachedQty !== "") {
                    inputQty.value = cachedQty;
                } else {
                    inputQty.value = getQtyForNota(noNotaCari, inputAcuanBarang.value.trim());
                }
            } else {
                inputQty.value = "";
            }
            syncDuplicateNotaOptions();
            hitungTotalAgen();
        }

        function pasangEventNota(row) {
            const selectNota = row.querySelector(".select-nota");
            const inputQty = row.querySelector(".input-qty-agen");

            selectNota.addEventListener("change", function() {
                tarikQtyBerdasarkanNota(row);
            });

            inputQty.addEventListener("input", hitungTotalAgen);
        }

        function buatBarisNota(isFirst = false, preselectNota = "") {
            const row = document.createElement("div");
            row.className = "row mb-3 baris-agen";
            row.innerHTML = `
                <div class="col-8 pe-1">
                    <select class="form-select select-nota">
                        ${notaOptionsHTML}
                    </select>
                </div>
                <div class="col-4 ps-1${isFirst ? "" : " d-flex gap-1"}">
                    <input type="number" class="form-control input-qty-agen" placeholder="Qty">
                    ${isFirst ? "" : `<button type="button" class="btn btn-danger btn-hapus fw-bold">X</button>`}
                </div>
            `;
            containerAgen.insertBefore(row, btnTambahAgen);
            pasangEventNota(row);

            const btnHapus = row.querySelector(".btn-hapus");
            if (btnHapus) {
                btnHapus.addEventListener("click", function() {
                    row.remove();
                    syncDuplicateNotaOptions();
                    hitungTotalAgen();
                });
            }

            if (preselectNota) {
                const sel = row.querySelector(".select-nota");
                sel.value = preselectNota;
                tarikQtyBerdasarkanNota(row);
            } else {
                syncDuplicateNotaOptions();
            }
            return row;
        }

        btnRefreshNota.addEventListener("click", async function() {
            if (!supabaseClient) return;
            const prevText = btnRefreshNota.textContent;
            btnRefreshNota.disabled = true;
            btnRefreshNota.textContent = "⏳ Memuat...";
            notaFilterHint.textContent = "Menyegarkan data nota & armada dari database...";
            try {
                customRangeCache.clear();
                detailQtyMap.clear();
                const [fetchedRecent] = await Promise.all([
                    fetchRangeFromDb(tglKemarin, tglHariIni),
                    loadArmadaFromDb()
                ]);
                recentNotas = fetchedRecent;
                customRangeCache.set(`${tglKemarin}|${tglHariIni}`, recentNotas);
                const jamSync = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const prefix = `Diperbarui ${jamSync}`;
                if (activeDateRange === "custom") {
                    await applyCustomDateRange(true, prefix);
                } else {
                    customNotas = recentNotas;
                    refreshDropdowns(true, prefix);
                }
            } catch (err) {
                console.error("Gagal menyegarkan data:", err);
                notaFilterHint.textContent = "Gagal menyegarkan data dari database.";
            } finally {
                btnRefreshNota.disabled = false;
                btnRefreshNota.textContent = prevText;
            }
        });

        inputAcuanBarang.addEventListener("input", function() {
            refreshDropdowns(true);
        });

        btnFilterHariIni.addEventListener("click", function() {
            activeDateRange = "today";
            refreshDropdowns(true);
        });

        btnFilter2Hari.addEventListener("click", function() {
            activeDateRange = "2days";
            refreshDropdowns(true);
        });

        btnFilterCustom.addEventListener("click", function() {
            activeDateRange = "custom";
            refreshDropdowns(true);
            applyCustomDateRange();
        });

        btnTerapkanRentang.addEventListener("click", function() {
            activeDateRange = "custom";
            applyCustomDateRange();
        });

        inputTglMulai.addEventListener("change", function() {
            if (activeDateRange === "custom") applyCustomDateRange();
        });

        inputTglSampai.addEventListener("change", function() {
            if (activeDateRange === "custom") applyCustomDateRange();
        });

        btnMuatSemuaNota.addEventListener("click", function() {
            if (!filteredNotas.length) {
                alert("Tidak ada nota yang cocok untuk dimuat.");
                return;
            }
            document.querySelectorAll(".baris-agen").forEach(r => r.remove());
            filteredNotas.forEach((item, idx) => {
                buatBarisNota(idx === 0, item.no_nota);
            });
            hitungTotalAgen();
        });

        document.querySelectorAll(".input-qty-bawa").forEach(input => input.addEventListener("input", hitungTotalBawa));
        pasangEventNota(document.querySelector(".baris-agen"));

        // 6. TAMBAH/HAPUS BARIS ARMADA
        const containerArmada = document.getElementById("containerArmada");
        const btnTambahArmada = document.getElementById("btnTambahArmada");

        btnTambahArmada.addEventListener("click", function() {
            const row = document.createElement("div");
            row.className = "row mb-3 baris-armada";
            row.innerHTML = `
                <div class="col-8 pe-1">
                    <select class="form-select select-armada">
                        ${armadaOptionsHTML}
                    </select>
                </div>
                <div class="col-4 ps-1 d-flex gap-1">
                    <input type="number" class="form-control input-qty-bawa" placeholder="Bawa">
                    <button type="button" class="btn btn-danger btn-hapus fw-bold">X</button>
                </div>
            `;
            containerArmada.insertBefore(row, btnTambahArmada);

            row.querySelector(".input-qty-bawa").addEventListener("input", hitungTotalBawa);
            row.querySelector(".btn-hapus").addEventListener("click", function() {
                row.remove();
                hitungTotalBawa();
            });
        });

        // 7. TAMBAH/HAPUS BARIS NOTA
        btnTambahAgen.addEventListener("click", function() {
            buatBarisNota(false, "");
        });

        // 8. KIRIM WHATSAPP
        const btnKirimWA = document.getElementById("btnKirimWA");

        btnKirimWA.addEventListener("click", function() {
            let teksWA = `*MONITORING PENGIRIMAN*\n`;
            teksWA += `Tanggal: ${elTanggal.textContent}\n`;
            teksWA += `Barang Acuan: *${inputAcuanBarang.value}*\n\n`;

            teksWA += `*🚗 DATA ARMADA & BAWAAN*\n`;
            let adaArmada = false;
            document.querySelectorAll(".baris-armada").forEach(baris => {
                const armada = baris.querySelector(".select-armada").value;
                const qty = baris.querySelector(".input-qty-bawa").value;
                if (armada && qty) {
                    teksWA += `- ${armada} : ${qty}\n`;
                    adaArmada = true;
                }
            });
            if (!adaArmada) teksWA += `- Belum ada data\n`;
            teksWA += `*Total Bawa:* ${displayTotalBawa.textContent}\n\n`;

            teksWA += `*📦 DISTRIBUSI BARANG*\n`;

            const valGudang = inputQtyGudang.value;
            if (valGudang && valGudang > 0) {
                teksWA += `- GUDANG : ${valGudang}\n`;
            }

            let adaNota = false;
            document.querySelectorAll(".baris-agen").forEach(baris => {
                const selectNota = baris.querySelector(".select-nota");
                const selectedOption = selectNota.options[selectNota.selectedIndex];
                const qty = baris.querySelector(".input-qty-agen").value;

                if (selectNota.value && qty) {
                    const namaAgen = selectedOption.getAttribute('data-agen');
                    teksWA += `- ${namaAgen} : ${qty}\n`;
                    adaNota = true;
                }
            });
            if (!adaNota && !valGudang) teksWA += `- Belum ada data\n`;

            teksWA += `*Total Distribusi:* ${displayTotalAgen.textContent}\n\n`;

            teksWA += `*⚖️ SELISIH (Distribusi - Bawaan): ${displaySelisih.textContent}*`;

            const encodedText = encodeURIComponent(teksWA);
            window.open(`https://wa.me/?text=${encodedText}`, '_blank');
        });
    });
</script>
</body>
</html>
