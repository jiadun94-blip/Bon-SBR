<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBR | Dashboard Driver</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f6f8; --text-color: #333333; }
        body { font-family: 'Roboto Condensed', sans-serif; background-color: var(--bg); color: var(--text-color); margin: 0; padding: 15px; padding-bottom: 50px; }
        
        /* HEADER */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #ffffff; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .logo-box img { height: 45px; width: auto; display: block; }
        .header-text { text-align: right; }
        .header h1 { font-size: 18px; color: #27ae60; margin: 0; text-transform: uppercase; font-weight: 700; }
        .header p { font-size: 11px; color: #666; margin: 3px 0 0 0; }

        /* MENU TOMBOL 3D SEPERTI DASHBOARD SBRDIGITAL */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        
        .menu-card { 
            padding: 18px 15px; 
            border-radius: 12px; 
            text-align: left; 
            text-decoration: none; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            min-height: 85px;
            transition: all 0.2s ease; 
            position: relative; 
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        /* Desain Elemen Transparan ala Gambar Referensi */
        .menu-card::after {
            content: attr(data-icon);
            position: absolute;
            right: -10px;
            bottom: -15px;
            font-size: 65px;
            opacity: 0.18;
            line-height: 1;
        }

        /* Warna Card Sesuai Referensi SBRdigital */
        .card-bon { background: linear-gradient(135deg, #2980b9, #3498db); }
        .card-laporan { background: linear-gradient(135deg, #d35400, #e67e22); }
        .card-monitoring { background: linear-gradient(135deg, #8e44ad, #9b59b6); }
        .card-riwayat { background: linear-gradient(135deg, #27ae60, #2ecc71); }

        .menu-card:active { 
            transform: scale(0.97); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .menu-card b { font-size: 18px; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .menu-card span { font-size: 14px; color: rgba(255, 255, 255, 0.85); z-index: 1; margin-top: 5px; font-weight: normal; }

        /* TABEL RIWAYAT */
        .section-title { font-size: 12px; color: #27ae60; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 5px; display: block; }
        
        .card-riwayat-box { 
            background: #ffffff; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border: 1px solid #eaeaea;
        }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; border-bottom: 1px solid #f1f3f5; vertical-align: middle; }
        
        .tgl-box { 
            text-align: center; 
            background: #f8f9fa; 
            border-radius: 8px; 
            padding: 6px; 
            min-width: 45px; 
            border: 1px solid #e9ecef; 
        }
        .tgl-hari { display: block; font-size: 9px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .tgl-angka { display: block; font-size: 18px; font-weight: bold; color: #2c3e50; line-height: 1.1; }

        .info-agen { padding-left: 12px; }
        .nama-agen { display: block; font-size: 15px; font-weight: bold; color: #2c3e50; text-transform: uppercase; }
        .nama-partner { display: block; font-size: 11px; color: #e67e22; margin-top: 3px; font-style: italic; font-weight: bold; }
        
        .empty-state { text-align: center; padding: 40px; color: #95a5a6; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-box">
        <img id="logoBrand" src="blogo.png" alt="SBRdigital Lembang Bandung Barat" onerror="this.src='logo.png'">
    </div>
    <div class="header-text">
        <h1 id="welcomeNama">HALO, DRIVER!</h1>
        <p>Selamat bekerja & utamakan keselamatan</p>
    </div>
</div>

<span class="section-title">Menu Utama</span>
<div class="menu-grid">
    <a href="bon.html" class="menu-card card-bon" data-icon="📝">
        <b>Buat Bon</b>
        <span>Catat Nota & Bon</span>
    </a>
    <a href="laporan_setoran.html" class="menu-card card-laporan" data-icon="🚀">
        <b>Laporan</b>
        <span>Monitoring Setoran Harian</span>
    </a>
</div>
<div class="menu-grid">
    <a href="mon_armada_driver.html" class="menu-card card-monitoring" data-icon="🚚">
        <b>Monitoring Armada</b>
        <span>Armada & Nomor Plat</span>
    </a>
    <a href="riwayat.html" class="menu-card card-riwayat" data-icon="🎥">
        <b>Riwayat Kiriman</b>
        <span>Arsip Pengiriman Selesai</span>
    </a>
</div>

<span class="section-title">Riwayat Kiriman Terakhir</span>
<div class="card-riwayat-box">
    <table>
        <tbody id="bodyRiwayat">
            <!-- Data Otomatis Masuk Sini -->
        </tbody>
    </table>
</div>

<script>
    const SB_URL = "https://yxcxvkairftqzmptkorr.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Y3h2a2FpcmZ0cXptcHRrb3JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTA0OTMsImV4cCI6MjA5MzM2NjQ5M30.t1l-EbUrTW_mz4sQfWG3vr6RER2_rdp3cSkfKWigGUs";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    const userLogin = localStorage.getItem("userNama") || "Ikih";

    window.onload = () => {
        document.getElementById('welcomeNama').innerText = "HALO, " + userLogin.toUpperCase() + "!";
        loadRiwayat();
    };

    async function loadRiwayat() {
        const tbody = document.getElementById('bodyRiwayat');
        tbody.innerHTML = '<tr><td class="empty-state">Menarik data transaksi...</td></tr>';

        try {
            const { data, error } = await _sb
                .from('transaksi')
                .select('tanggal, nama_agen, driver_1, driver_2, created_at')
                .or(`driver_1.eq.${userLogin},driver_2.eq.${userLogin}`)
                .order('tanggal', { ascending: false })
                .order('created_at', { ascending: false })
                .limit(20);

            if (error) throw error;

            tbody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(item => {
                    const tglObj = new Date(item.tanggal);
                    const hari = tglObj.toLocaleDateString('id-ID', { weekday: 'short' });
                    const tgl = item.tanggal.split('-')[2];

                    let partner = "";
                    if (item.driver_1 === userLogin) {
                        partner = (item.driver_2 && item.driver_2 !== "EMPTY") ? item.driver_2 : "Sendiri";
                    } else {
                        partner = item.driver_1 || "Sendiri";
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td width="65">
                                <div class="tgl-box">
                                    <span class="tgl-hari">${hari}</span>
                                    <span class="tgl-angka">${tgl}</span>
                                </div>
                            </td>
                            <td class="info-agen">
                                <span class="nama-agen">${item.nama_agen}</span>
                                <span class="nama-partner">🤝 Partner: ${partner}</span>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td class="empty-state">Belum ada data untuk <b>${userLogin}</b>.</td></tr>`;
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td class="empty-state" style="color:red;">Error: ${err.message}</td></tr>`;
        }
    }
</script>

</body>
</html>
